version: '3.8'
services:
  nl2sql-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nl2sql-gui-app
    container_name: nl2sql-gui
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs

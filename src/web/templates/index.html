<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>自然语言转 SQL 工具</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --error-color: #ef4444;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      color: #fff;
      padding: 1.5rem 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
    }

    main {
      padding: 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    section:hover {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: var(--text-main);
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 0.75rem;
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
    }

    textarea, input[type="text"], input[type="number"], select, input[type="file"] {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }

    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .radio-group {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      background: var(--bg-color);
      padding: 0.75rem;
      border-radius: 8px;
    }

    .radio-group label {
      margin: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-main);
    }

    button[type="submit"] {
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      padding: 0.875rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
      margin-top: 1rem;
    }

    button[type="submit"]:hover {
      background-color: var(--primary-hover);
    }

    button[type="submit"]:active {
      transform: scale(0.98);
    }

    details {
      background: var(--bg-color);
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
    }

    details summary {
      padding: 1rem;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-main);
      user-select: none;
      transition: background-color 0.2s;
    }

    details summary:hover {
      background-color: #e2e8f0;
    }

    details[open] summary {
      border-bottom: 1px solid var(--border-color);
    }

    details > div {
      padding: 1.5rem;
    }

    .flex {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .flex > div {
      flex: 1;
      min-width: 200px;
    }

    .logs {
      width: 100%;
      height: 300px;
      background-color: var(--code-bg);
      color: var(--code-text);
      font-family: 'Consolas', 'Monaco', monospace;
      padding: 1rem;
      border-radius: 8px;
      border: none;
      resize: vertical;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .result-box {
      background-color: var(--code-bg);
      color: var(--code-text);
      padding: 1.5rem;
      border-radius: 8px;
      overflow-x: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      margin-top: 0.5rem;
    }

    .result-item {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #fff;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-warning { background: #fef3c7; color: #92400e; }

    .progress-container {
      background: var(--border-color);
      border-radius: 9999px;
      height: 12px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary-color);
      border-radius: 9999px;
      transition: width 0.3s ease;
    }

    .download-links a {
      display: inline-block;
      margin-right: 1rem;
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border: 1px solid var(--primary-color);
      border-radius: 6px;
      transition: all 0.2s;
    }

    .download-links a:hover {
      background: var(--primary-color);
      color: #fff;
    }

    /* Loading Spinner */
    .spinner-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.9);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      backdrop-filter: blur(4px);
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<header>
  <h1>自然语言转 SQL 工具</h1>
</header>
<main>
  <section>
    <h2>系统简介</h2>
    <pre style="white-space: pre-wrap; font-family: inherit; color: var(--text-secondary);">{{ introduction }}</pre>
  </section>

  {% if error %}
  <section style="border-left: 4px solid var(--error-color); background: #fef2f2;">
    <h3 style="color: var(--error-color); margin: 0 0 0.5rem 0;">错误提示</h3>
    <p style="margin: 0;">{{ error }}</p>
  </section>
  {% endif %}

  <section>
    <h2>参数配置与处理</h2>
    <form method="post" action="/process" enctype="multipart/form-data">
      <div class="radio-group">
        <label><input type="radio" name="mode" value="single" {% if mode == "single" %}checked{% endif %}/> 单个问题模式</label>
        <label><input type="radio" name="mode" value="batch" {% if mode == "batch" %}checked{% endif %}/> 批量处理模式</label>
      </div>

      <div id="single-wrapper">
        <label>问题描述</label>
        <textarea name="question" rows="4" placeholder="请输入自然语言问题...">{{ question_text }}</textarea>
      </div>

      <div id="batch-wrapper">
        <label>Excel 文件上传</label>
        <input type="file" name="excel_file" accept=".xlsx" />
      </div>

      <details open>
        <summary>LLM 设置</summary>
        <div>
          <div class="flex">
            <div><label>API Key</label><input type="text" name="llm.api_key" value="{{ settings.llm.api_key }}"/></div>
            <div><label>Base URL</label><input type="text" name="llm.base_url" value="{{ settings.llm.base_url }}"/></div>
            <div><label>Model</label><input type="text" name="llm.model" value="{{ settings.llm.model }}"/></div>
          </div>
          <div class="flex">
            <div><label>Temperature</label><input type="number" step="0.1" name="llm.temperature" value="{{ settings.llm.temperature }}"/></div>
            <div><label>Max Tokens</label><input type="number" name="llm.max_tokens" value="{{ settings.llm.max_tokens }}"/></div>
            <div><label>Max Retries</label><input type="number" name="llm.max_retries" value="{{ settings.llm.max_retries }}"/></div>
          </div>
        </div>
      </details>

      <details>
        <summary>工作流设置</summary>
        <div>
          <div class="flex">
            <div><label>通过置信度 (%)</label><input type="number" name="workflow.confidence_threshold" value="{{ settings.workflow.confidence_threshold }}"/></div>
            <div><label>最大重试轮数</label><input type="number" name="workflow.max_retry_rounds" value="{{ settings.workflow.max_retry_rounds }}"/></div>
            <div><label>验证 Temperature</label><input type="number" step="0.1" name="workflow.validation_temperature" value="{{ settings.workflow.validation_temperature }}"/></div>
          </div>
          <div class="flex">
            <div><label>验证 Max Tokens</label><input type="number" name="workflow.validation_max_tokens" value="{{ settings.workflow.validation_max_tokens }}"/></div>
            <div><label>置信度重复次数</label><input type="number" name="workflow.confidence_repeat_count" value="{{ settings.workflow.confidence_repeat_count }}"/></div>
            <div><label>置信度容差</label><input type="number" name="workflow.confidence_variation_threshold" value="{{ settings.workflow.confidence_variation_threshold }}"/></div>
          </div>
        </div>
      </details>

      <details id="excel-settings-details">
        <summary>Excel 设置</summary>
        <div>
          <div class="flex">
            <div><label>开始行</label><input type="number" name="excel.start_row" value="{{ settings.excel.start_row }}"/></div>
            <div><label>问题列</label><input type="number" name="excel.start_col" value="{{ settings.excel.start_col }}"/></div>
            <div><label>输出列</label><input type="number" name="excel.output_col" value="{{ settings.excel.output_col }}"/></div>
          </div>
          <div class="flex">
            <div><label>问题数量</label><input type="number" name="excel.num_questions" value="{{ settings.excel.num_questions }}"/></div>
            <div><label>Sheet 名称</label><input type="text" name="excel.sheet_name" value="{{ settings.excel.sheet_name }}"/></div>
          </div>
        </div>
      </details>

      <details>
        <summary>路径与日志设置</summary>
        <div>
          <div class="flex">
            <div><label>配置目录</label><input type="text" name="config_dir" value="{{ settings.config_dir }}"/></div>
            <div><label>训练文件</label><input type="text" name="training_file_path" value="{{ settings.training_file_path }}"/></div>
          </div>
          <div class="flex">
            <div><label>日志目录</label><input type="text" name="logging.log_dir" value="{{ settings.logging.log_dir }}"/></div>
            <div><label>日志名称</label><input type="text" name="logging.log_name" value="{{ settings.logging.log_name }}"/></div>
            <div><label>日志级别</label><input type="text" name="logging.level_str" value="{{ settings.logging.level_str }}"/></div>
          </div>
        </div>
      </details>

      <button type="submit">开始处理</button>
    </form>
  </section>

  <section id="progress-section" style="display:none;">
    <h2>处理进度</h2>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
        <div id="status-text" style="font-weight: 600; color: var(--primary-color);">准备就绪</div>
        <div id="progress-count" style="font-weight: 600; color: var(--text-secondary);"></div>
    </div>
    <div id="progress-bar-container" style="display: none;">
      <div class="progress-container">
        <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
      </div>
    </div>
    <div id="results-container" style="margin-top: 1.5rem;">
      <!-- Dynamic results will appear here -->
    </div>
  </section>

  <section id="logs-section" style="display:none;">
    <h2>运行日志</h2>
    <textarea class="logs" id="logs-area" readonly></textarea>
  </section>

  <section id="final-result-section" style="display:none;">
    <h2>最终结果</h2>
    <div id="final-result-content"></div>
  </section>

</main>

<div class="spinner-overlay" id="loadingSpinner">
  <div class="spinner"></div>
  <div style="font-size: 1.1rem; font-weight: 500; color: var(--text-main);">正在处理中，请稍候...</div>
</div>

<script>
  function toggleMode(mode) {
    const single = document.getElementById("single-wrapper");
    const batch = document.getElementById("batch-wrapper");
    const excelSettings = document.getElementById("excel-settings-details");
    
    single.style.display = mode === "single" ? "block" : "none";
    batch.style.display = mode === "batch" ? "block" : "none";
    if (excelSettings) {
      excelSettings.style.display = mode === "batch" ? "block" : "none";
    }
  }

  function scrollToElement(id) {
    const el = document.getElementById(id);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    const radios = document.querySelectorAll('input[name="mode"]');
    radios.forEach(r => r.addEventListener("change", e => toggleMode(e.target.value)));
    const initial = "{{ mode }}" || "single";
    toggleMode(initial);

    const form = document.querySelector("form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      // Reset UI
      document.getElementById("progress-section").style.display = "block";
      document.getElementById("logs-section").style.display = "block";
      document.getElementById("final-result-section").style.display = "none";
      document.getElementById("results-container").innerHTML = "";
      document.getElementById("logs-area").value = "";
      document.getElementById("status-text").innerText = "正在初始化...";
      document.getElementById("progress-bar-container").style.display = "none";
      document.getElementById("progress-bar").style.width = "0%";
      document.getElementById("progress-count").innerText = "";
      
      // Auto-scroll to progress section
      setTimeout(() => scrollToElement("progress-section"), 100);

      const formData = new FormData(form);
      const mode = formData.get("mode");
      const settings = {};
      
      for (let [key, value] of formData.entries()) {
        if (key.includes(".")) {
           settings[key] = value;
        } else {
           settings[key] = value;
        }
      }

      let filePath = "";
      
      if (mode === "batch") {
        const fileInput = document.querySelector('input[name="excel_file"]');
        if (fileInput.files.length > 0) {
           const uploadData = new FormData();
           uploadData.append("file", fileInput.files[0]);
           
           try {
             document.getElementById("status-text").innerText = "正在上传文件...";
             const resp = await fetch("/upload", { method: "POST", body: uploadData });
             if (!resp.ok) throw new Error("Upload failed");
             const json = await resp.json();
             filePath = json.file_path;
             settings["excel.file_path"] = filePath;
           } catch (err) {
             alert("文件上传失败: " + err.message);
             return;
           }
        } else {
            alert("请选择 Excel 文件");
            return;
        }
      }

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
      
      ws.onopen = () => {
        document.getElementById("status-text").innerText = "已连接，开始处理...";
        ws.send(JSON.stringify({
          action: "start",
          mode: mode,
          question: formData.get("question"),
          settings: settings
        }));
      };
      
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "log") {
          const logsArea = document.getElementById("logs-area");
          logsArea.value += msg.content + "\n";
          logsArea.scrollTop = logsArea.scrollHeight;
        } else if (msg.type === "status") {
          document.getElementById("status-text").innerText = msg.content;
        } else if (msg.type === "progress") {
          const { current, total } = msg.content;
          const percent = Math.round((current / total) * 100);
          const barContainer = document.getElementById("progress-bar-container");
          const bar = document.getElementById("progress-bar");
          barContainer.style.display = "block";
          bar.style.width = percent + "%";
          document.getElementById("progress-count").innerText = `已处理: ${current} / ${total} (${percent}%)`;
        } else if (msg.type === "row_result") {
          const container = document.getElementById("results-container");
          const div = document.createElement("div");
          div.className = "result-item";
          const passed = msg.data.validation.passed;
          const badgeClass = passed ? "badge-success" : "badge-warning";
          const badgeText = passed ? "通过" : "未通过";
          
          div.innerHTML = `
            <div class="result-header">
              <span class="badge ${badgeClass}">${badgeText} [Round ${msg.data.round}]</span>
              <small style="color: var(--text-secondary)">置信度: ${msg.data.validation.confidence || 0}%</small>
            </div>
            <div style="margin-bottom: 0.5rem; font-weight: 500;">${msg.data.question}</div>
            <details>
              <summary style="font-size: 0.9rem; color: var(--primary-color);">查看 SQL</summary>
              <pre style="background: var(--bg-color); padding: 0.75rem; border-radius: 6px; margin-top: 0.5rem; overflow-x: auto;">${msg.data.sql}</pre>
            </details>
          `;
          container.appendChild(div);
          // Optional: scroll to new result if needed, but might be annoying in batch
        } else if (msg.type === "done") {
          document.getElementById("status-text").innerText = "处理完成";
          const resultSection = document.getElementById("final-result-section");
          const resultContent = document.getElementById("final-result-content");
          resultSection.style.display = "block";
          
          const res = msg.result;
          if (res.mode === "batch") {
             resultContent.innerHTML = `
               <div style="text-align: center; padding: 2rem;">
                 <p style="font-size: 1.1rem; margin-bottom: 1.5rem;">已成功处理 ${res.summary.processed_count} / ${res.summary.total_questions} 个问题</p>
                 <div class="download-links">
                   <a href="/download?path=${res.output_file}" target="_blank">📥 下载结果 Excel</a>
                   <a href="/download?path=${res.validation_file}" target="_blank">📥 下载验证详情</a>
                 </div>
               </div>`;
          } else {
             resultContent.innerHTML = `
               <p><strong>生成的 SQL:</strong></p>
               <pre class="result-box">${res.sql}</pre>
               <p style="margin-top: 1rem;"><strong>置信度:</strong> <span class="badge ${res.confidence >= 80 ? 'badge-success' : 'badge-warning'}">${res.confidence}%</span></p>`;
          }
          ws.close();
          
          // Auto-scroll to final result
          setTimeout(() => scrollToElement("final-result-section"), 100);
          
        } else if (msg.type === "error") {
          alert("错误: " + msg.content);
          ws.close();
        }
      };
      
      ws.onerror = (err) => {
        console.error("WebSocket error", err);
        document.getElementById("status-text").innerText = "连接发生错误";
      };
    });
  });
</script>
</body>
</html>
